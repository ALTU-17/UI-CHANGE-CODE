plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "12" // or whatever you want
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.1.1"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "in.aceventura.evolvuschool"

    // ✅ SDK levels
    compileSdkVersion 36

    defaultConfig {
        applicationId "in.aceventura.evolvuschool"
        minSdkVersion 25
        targetSdkVersion 36

        versionCode 108
        versionName flutterVersionName

        // ✅ Only 64-bit ABI (for 16 KB page support)
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    // ✅ Java / desugaring
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true   // 🔥 REQUIRED
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
            storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword = keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false

            // You can keep ProGuard / R8 rules if you had them:
            // proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }

        debug {
            // default debug config is fine
        }
    }

    // ✅ New packaging DSL for AGP 8+
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // ✅ REQUIRED for flutter_local_notifications 18.x
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    implementation platform("com.google.firebase:firebase-bom:32.7.2")
    implementation "com.google.firebase:firebase-messaging:23.0.0"
}


